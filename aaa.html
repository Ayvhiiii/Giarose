<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Click Me More!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background: #dee3af;
    }
    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
    button {
      margin-top: 20px;
      padding: 20px 40px;
      font-size: 24px;
      background-color: #961212;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #4a0a0a;
    }
    .result {
      margin-top: 30px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Update me!</h1>
  <p>Its like the bracelet on tiktok but on a website! YAY!</p>
  <p>Enter your name:</p>
  <input type="text" id="nameInput" placeholder="Your name here" />
  <br>
  <button onclick="recordClick()">Click Me!</button>

  <div class="result" id="resultDisplay">
    No clicks recorded yet.
  </div>

  <script>
    function recordClick() {
      const name = document.getElementById('nameInput').value.trim();
      if (name === "") {
        alert("Please enter your name before clicking.");
        return;
      }

      const now = new Date();
      const dateTime = now.toLocaleString();
      const message = `Last clicked by: <strong>${name}</strong><br>On: <strong>${dateTime}</strong>`;

      document.getElementById('resultDisplay').innerHTML = message;
    }
  </script>

</body>
</html>
