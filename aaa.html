<!DOCTYPE html>
<html>
<head>
  <title>Click Tracker</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
	  background: #dee3af;
    }
    input {
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 20px 40px;
      font-size: 24px;
      margin-top: 20px;
      background-color: #961212;
      color: white;
      border: none;
      border-radius: 8px;
    }
	
	button:hover {
      background-color: #4a0a0a;
    }
    .record {
      margin-top: 30px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Ping me!</h1>
  <p>Enter your Message:</p>
  <p>Hello We are Gia and Miggs, Send a message after the beep...!</p>
  <input type="text" id="nameInput" placeholder="Enter your Message" />
  <br>
  <button onclick="recordClick()">Click Me!</button>

  <div class="record" id="lastRecord">Loading last record...</div>

  <script>
    // ✅ Replace this config with YOUR Firebase project settings
    const firebaseConfig = {
  apiKey: "AIzaSyCWEWAIDr2Kjn6FSfzZVYpCccZ-yH17MLk",
  authDomain: "clickgiarose.firebaseapp.com",
  projectId: "clickgiarose",
  storageBucket: "clickgiarose.firebasestorage.app",
  messagingSenderId: "32256022653",
  appId: "1:32256022653:web:ab4c41a261a1b3c2b8b914",
  measurementId: "G-9VT2X6V4X1"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const lastRecordRef = database.ref('lastClick');

    function recordClick() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert("Please enter your name!");
        return;
      }

      const now = new Date().toLocaleString();

      const clickData = {
        name: name,
        time: now
      };

      lastRecordRef.set(clickData);
    }

    // Show latest click live to all users
    lastRecordRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('lastRecord').innerHTML = 
          `Last clicked by: <strong>${data.name}</strong><br>At: <strong>${data.time}</strong>`;
      } else {
        document.getElementById('lastRecord').innerText = "No record yet.";
      }
    });
  </script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
